# Builds the static site (web/ plus the compiled wasm in web/pkg) and
# publishes it to GitHub Pages. No game data is involved: players open
# their own disc in the browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen 0.2.100
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.100/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" wasm-bindgen-0.2.100-x86_64-unknown-linux-musl/wasm-bindgen
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
